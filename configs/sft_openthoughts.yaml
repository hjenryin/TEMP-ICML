### Model configuration
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### Training method
stage: sft
do_train: true
finetuning_type: full
overwrite_output_dir: true

### Dataset configuration - will be overridden via CLI
dataset_dir:
dataset:
template: qwen
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 32

### Output configuration - will be overridden via CLI
output_dir:
logging_steps: 1
save_steps: 1000
plot_loss: true
save_only_model: true
seed: 10000

### Training hyperparameters
per_device_train_batch_size: 2
gradient_accumulation_steps:   # Will be overridden via CLI to maintain effective batch size of 16

# learning_rate: 1.0e-5
# num_train_epochs: 10.0
# lr_scheduler_type: cosine
# warmup_ratio: 0.1
# weight_decay: 1.0e-4

# ### Optimizer configuration
# optim: adamw_torch
# adam_beta1: 0.9
# adam_beta2: 0.999
# adam_epsilon: 1.0e-8

learning_rate: 1.0e-5
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 1.0e-4

### Optimizer configuration
adam_beta1: 0.9
adam_beta2: 0.95

### Mixed precision and optimization
bf16: true
flash_attn: fa2

### Distributed training configuration (DeepSpeed)
deepspeed: ../configs/ds_z2_config.json
ddp_timeout: 1800000
enable_liger_kernel: true
dataloader_drop_last: true

### Evaluation strategy
eval_strategy: "no"

### Logging and monitoring
report_to: wandb
run_name: qwen_7b_openthoughts-math_llama_factory

### Gradient checkpointing
gradient_checkpointing: true
